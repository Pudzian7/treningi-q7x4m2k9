<style>
:root { color-scheme: dark; padding-block-start: env(safe-area-inset-top, 0px); padding-block-end: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #07090d; color: #eaeef5; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; text-align: center; }
img { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.02em; }
p { margin: 0; color: #8d98a8; font-size: 0.925rem; }
input { appearance: none; background: #181e28; color: #eaeef5; border: 1px solid #232a36; border-radius: 8px; padding: 14px; font: inherit; font-size: 1.05rem; text-align: center; }
input:focus-visible, button:focus-visible { outline: 3px solid #8ab8ff; outline-offset: 2px; }
button { appearance: none; background: #3b82f6; color: #fff; border: 0; border-radius: 8px; padding: 14px; font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer; }
button[disabled] { opacity: .6; }
.err { color: #ff5a69; min-height: 1.4em; }
</style>
